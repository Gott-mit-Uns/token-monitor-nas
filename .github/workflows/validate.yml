name: Test and publish NAS image
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: token-monitor-nas-publish
  cancel-in-progress: false
jobs:
  build_amd64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check publication safety
        run: python3 scripts/check-publication-safety.py
      - name: Read release version
        id: version
        run: |
          version=$(node scripts/check-nas-version.js)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test without NAS data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t token-monitor-test .
          docker run --rm -e GITHUB_TOKEN -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-release.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" token-monitor-test node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/test-nas.js
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published amd64 runtime
        run: |
          image=ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          docker pull --platform linux/amd64 "$image"
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
  verify_arm64:
    needs: build_amd64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify arm64 runtime on native Linux
        run: |
          test "$(uname -m)" = aarch64
          image=ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          docker pull --platform linux/arm64 "$image"
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
  promote:
    needs: [build_amd64, verify_arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version after verification
        env:
          NAS_VERSION: ${{ needs.build_amd64.outputs.version }}
        run: |
          version_image=ghcr.io/gott-mit-uns/token-monitor-hermes:${NAS_VERSION}
          if docker buildx imagetools inspect "$version_image" >/tmp/version-inspect.out 2>/tmp/version-inspect.err; then
            echo "Version already exists; refusing to overwrite or repoint latest."
            exit 1
          elif grep -Eqi 'manifest unknown|not found' /tmp/version-inspect.err; then
            docker buildx imagetools create --tag "$version_image" \
              ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          else
            echo "Unable to confirm version absence; refusing to publish a fixed tag."
            exit 1
          fi
      - name: Promote verified image to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gott-mit-uns/token-monitor-hermes:latest \
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${GITHUB_SHA}
          docker buildx imagetools inspect ghcr.io/gott-mit-uns/token-monitor-hermes:latest
