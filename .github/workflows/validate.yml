name: Test and publish NAS image
on:
  push:
    tags: ['v*.*.*-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: token-monitor-nas-publish
  cancel-in-progress: false
jobs:
  build_amd64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check publication safety
        run: python3 scripts/check-publication-safety.py
      - name: Read release version
        id: version
        run: |
          node app/scripts/nas-hub-build.js
          version=$(node scripts/check-nas-version.js)
          test "$GITHUB_REF" = "refs/tags/$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test publication and deployment gates without registry or NAS access
        shell: bash
        run: |
          mkdir -p /tmp/nas-publication-tests
          node --test scripts/tests/*.test.js 2>&1 | tee /tmp/nas-publication-tests/node-tests.txt
          python3 -m unittest discover -s deployment/tests -v 2>&1 | tee /tmp/nas-publication-tests/python-tests.txt
      - name: Build and test without NAS data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t token-monitor-test .
          docker run --rm --init -e GITHUB_TOKEN -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-release.js
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-clients.js
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" token-monitor-test node scripts/verify-vendored-tokscale.js
          docker run --rm --init -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/test-nas.js
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate image
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published amd64 runtime
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          image=$(node scripts/promote-nas-image.js --candidate-ref)
          docker pull --platform linux/amd64 "$image"
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm --init -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
      - name: Save publication test records in CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-gate-tests
          path: /tmp/nas-publication-tests/*.txt
          if-no-files-found: warn
  verify_arm64:
    needs: build_amd64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify arm64 runtime on native Linux
        env:
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
        run: |
          test "$(uname -m)" = aarch64
          image=$(node scripts/promote-nas-image.js --candidate-ref)
          docker pull --platform linux/arm64 "$image"
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm --init -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm --init -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
  promote:
    needs: [build_amd64, verify_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable fixed image after native verification
        env:
          NAS_VERSION: ${{ needs.build_amd64.outputs.version }}
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/promote-nas-image.js --fixed-only
      - name: Record verified manifest and upgrade/rollback notes in repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NAS_VERSION: ${{ needs.build_amd64.outputs.version }}
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/nas-publication.js
      - name: Update latest only after repository record verification
        env:
          NAS_VERSION: ${{ needs.build_amd64.outputs.version }}
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/promote-nas-image.js
