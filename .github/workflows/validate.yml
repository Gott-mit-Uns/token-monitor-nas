name: Test and publish NAS image
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: token-monitor-nas-publish
  cancel-in-progress: false
jobs:
  build_amd64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check publication safety
        run: python3 scripts/check-publication-safety.py
      - name: Read release version
        id: version
        run: |
          version=$(node scripts/check-nas-version.js)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test release promotion recovery without registry access
        run: node --test scripts/tests/*.test.js
      - name: Build and test without NAS data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t token-monitor-test .
          docker run --rm -e GITHUB_TOKEN -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-release.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" token-monitor-test node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" token-monitor-test node scripts/test-nas.js
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate image
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gott-mit-uns/token-monitor-hermes:sha-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published amd64 runtime
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          image=$(node scripts/promote-nas-image.js --candidate-ref)
          docker pull --platform linux/amd64 "$image"
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
  verify_arm64:
    needs: build_amd64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify arm64 runtime on native Linux
        env:
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
        run: |
          test "$(uname -m)" = aarch64
          image=$(node scripts/promote-nas-image.js --candidate-ref)
          docker pull --platform linux/arm64 "$image"
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/verify-vendored-tokscale-clients.js
          docker run --rm -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" -v "$PWD/app/tests:/opt/token-monitor/tests:ro" "$image" node scripts/verify-vendored-tokscale.js
          docker run --rm -v "$PWD/app/tests:/opt/token-monitor/tests:ro" -v "$PWD/app/scripts:/opt/token-monitor/scripts:ro" "$image" node scripts/test-nas.js
  promote:
    needs: [build_amd64, verify_arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified digest with recoverable immutable version tagging
        env:
          NAS_VERSION: ${{ needs.build_amd64.outputs.version }}
          CANDIDATE_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/promote-nas-image.js
