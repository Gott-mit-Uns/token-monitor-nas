name: Validate controlled deployment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-deployment-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        baseline: ['v0.69.0-01', 'v0.69.0-02', 'v0.70.0-01', 'v0.71.0-01', 'v0.71.0-02', 'v0.72.0-01', 'v0.72.0-02', 'v0.73.0-01', 'v0.74.0-01', 'v0.75.0-01', 'v0.76.0-01']
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test repository publications and explicit deployment requests
        run: |
          node scripts/check-nas-version.js
          node --test scripts/tests/*.test.js
          python3 -m unittest discover -s deployment/tests -v
          git diff --check
      - name: Build native sandbox candidate without publishing
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          docker build --build-arg VCS_REF="$SOURCE_COMMIT" -t token-monitor-deployment-sandbox .
      - name: Frozen real Hermes SQLite old new accounting and Hub ingress
        run: |
          python3 deployment/frozen_hermes.py --candidate token-monitor-deployment-sandbox --baseline-version '${{ matrix.baseline }}' --output /tmp/frozen-hermes-result.json
      - name: Real Docker synthetic Hub Agent and full-state rollback rehearsal
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sudo python3 deployment/exercise.py --candidate token-monitor-deployment-sandbox --source "$SOURCE_COMMIT" --baseline-version '${{ matrix.baseline }}' --output /tmp/deployment-exercise-result.json
      - name: Reasoning cost manual-path rehearsal with production guard retained
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sudo python3 deployment/exercise.py --reasoning --candidate token-monitor-deployment-sandbox --source "$SOURCE_COMMIT" --baseline-version '${{ matrix.baseline }}' --output /tmp/reasoning-deployment-exercise-result.json
      - name: Save synthetic acceptance summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: deployment-exercise-${{ matrix.runner }}-${{ matrix.baseline }}
          path: |
            /tmp/deployment-exercise-result.json
            /tmp/frozen-hermes-result.json
            /tmp/reasoning-deployment-exercise-result.json
          if-no-files-found: error
