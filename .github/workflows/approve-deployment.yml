name: Request controlled NAS deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: NAS for this manual deployment request
        type: choice
        required: true
        options: [DXP4800, DH4300Plus]
      version:
        description: Published immutable NAS version (v0.69.0-02)
        type: string
        required: true
      from_version:
        description: Verified currently installed NAS version
        type: string
        required: true

permissions: {}
concurrency:
  group: approved-production-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require manual dispatch from main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NAS_TARGET: ${{ inputs.target }}
          NAS_VERSION: ${{ inputs.version }}
          NAS_FROM_VERSION: ${{ inputs.from_version }}
        run: node scripts/approve-nas-deployment.js --preflight
  approve:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Verify released image and queue approved request
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NAS_TARGET: ${{ inputs.target }}
          NAS_VERSION: ${{ inputs.version }}
          NAS_FROM_VERSION: ${{ inputs.from_version }}
        run: node scripts/approve-nas-deployment.js
