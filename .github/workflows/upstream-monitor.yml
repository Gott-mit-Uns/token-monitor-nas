name: Report official upstream releases
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare latest public release with frozen baseline
        run: |
          python3 scripts/report-upstream.py --output upstream-change-report.md
          cat upstream-change-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: official-upstream-report
          path: upstream-change-report.md
