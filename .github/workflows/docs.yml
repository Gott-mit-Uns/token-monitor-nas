name: Documentation governance
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check current documentation and README authorization
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_doc_governance.py' -v
          python3 scripts/check-docs.py --base "$DOCS_BASE"
